services:
  backend:
    build:
      context: ./Backend/agrotis-backend
    environment:
      AGROTIS_DB_URL: jdbc:h2:file:/app/data/agrotis;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    ports:
      - "8080:8080"
    volumes:
      - agrotis-db:/app/data

  frontend:
    build:
      context: ./Frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  agrotis-db:
